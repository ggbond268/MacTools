name: Gitee Release

on:
  workflow_run:
    workflows:
      - Release
      - Plugin Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub tag to mirror or repair, such as v1.3.0 or plugins-1.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve published release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.source.outputs.tag || inputs.tag }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read the source run's release artifact metadata
        id: source
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync-gitee-release.py \
            --github-repo "$GITHUB_REPOSITORY" \
            --workflow-run-event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT"

  mirror:
    name: Mirror published release to Gitee
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual repairs and automatic runs for the same tag must not race.
    concurrency:
      group: gitee-release-${{ github.repository }}-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Synchronize release metadata and attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 scripts/sync-gitee-release.py \
            --github-repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"
