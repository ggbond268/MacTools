settings:
  base:
    OTHER_LDFLAGS: -framework ApplicationServices -framework AVFoundation -framework QuickLookThumbnailing -framework Vision -framework WebKit -lsqlite3

targets:
  mactools-clipboard-pasteboard-reader-helper:
    type: tool
    platform: macOS
    deploymentTarget: '14.0'
    bundleResourcePath: PasteboardReaderHelper
    sources:
      - path: PasteboardReaderHelper/Sources
      - path: Sources/ClipboardPasteboardReaderWire.swift
    settings:
      base:
        PRODUCT_NAME: mactools-clipboard-pasteboard-reader-helper
        PRODUCT_BUNDLE_IDENTIFIER: "$(BUNDLE_IDENTIFIER_PREFIX).mactools.plugins.clipboard.pasteboard-reader-helper"
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
